<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype: Await Input</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
      }

      .hidden {
        display: none;
      }

      #await-input {
        background-color: black;
        color: rgba(255, 255, 255, 0.85);
      }

      body {
        display: flex;
        justify-content: center;
      }
      .parappa-the-wrappa {
        display: flex;
        flex-flow: column wrap;
        max-width: 10rem;
      }

      input[readonly] {
        opacity: 70%;
        background: lightgrey;
      }
    </style>
  </head>

  <body>
    <div class="parappa-the-wrappa">
      <h2>Prototype: Await Input</h2>
      <button id="ask-for-input">Get the user input</button>
      <br />
      <label for="input">Input:</label>
      <input type="text" name="input" id="input" readonly />
      <div id="await-input" class="hidden">
        <span>Awaiting input...</span>
      </div>
      <input type="submit" value="Submit" id="submit"/>
      <br />
      <label for="output">Output:</label>
      <input type="text" name="output" id="output" readonly />
      <script src="waitForInput.js"></script>
    </div>
  </body>
</html>
